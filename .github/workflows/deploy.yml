name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]

env:
  REGION: us-central1
  SERVICE_NAME: team-pollito-awards
  REPO_NAME: team-pollito-registry
  PROJECT_ID: angelic-throne-502610-v3
  PROJECT_NUMBER: "986642980997"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-awards-pool/providers/github-awards-provider"
          service_account: "github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate integration secrets
        env:
          OVERLAY_TOKEN: ${{ secrets.OVERLAY_TOKEN }}
          TIKTOK_IMPORT_TOKEN: ${{ secrets.TIKTOK_IMPORT_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          test -n "$OVERLAY_TOKEN" || { echo "Missing OVERLAY_TOKEN"; exit 1; }
          test -n "$TIKTOK_IMPORT_TOKEN" || { echo "Missing TIKTOK_IMPORT_TOKEN"; exit 1; }
          test "$NEXT_PUBLIC_SITE_URL" = "https://teampollito.milumon.dev" || { echo "NEXT_PUBLIC_SITE_URL must be https://teampollito.milumon.dev"; exit 1; }

      - name: Create Artifact Registry (first time only)
        run: |
          gcloud artifacts repositories create ${{ env.REPO_NAME }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} || true

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Docker image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}
          docker pull $IMAGE:latest || true
          docker build \
            --cache-from $IMAGE:latest \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
            --build-arg NEXT_PUBLIC_VOTING_PHASE=${{ secrets.NEXT_PUBLIC_VOTING_PHASE }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL_PROD"; exit 1; }
          supabase db push --db-url "$DATABASE_URL"

      - name: Deploy to Cloud Run
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          GOOGLE_CREDS_B64=$(printf '%s' "$GOOGLE_CREDS" | base64 -w 0)
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
             --set-env-vars "NODE_ENV=production" \
             --set-env-vars "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
             --set-env-vars "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --set-env-vars "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --set-env-vars "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --set-env-vars "NEXT_PUBLIC_VOTING_PHASE=${{ secrets.NEXT_PUBLIC_VOTING_PHASE }}" \
            --set-env-vars "ADMIN_PANEL_TOKEN=${{ secrets.ADMIN_PANEL_TOKEN }}" \
            --set-env-vars "OVERLAY_TOKEN=${{ secrets.OVERLAY_TOKEN }}" \
            --set-env-vars "TIKTOK_IMPORT_TOKEN=${{ secrets.TIKTOK_IMPORT_TOKEN }}" \
            --set-env-vars "ROBLOSECURITY_COOKIE=${{ secrets.ROBLOSECURITY_COOKIE }}" \
            --set-env-vars "ROBLOX_CLOTHING_ID=${{ secrets.ROBLOX_CLOTHING_ID }}" \
            --set-env-vars "ROBLOX_ALEXA_VM_URL=${{ secrets.ROBLOX_ALEXA_VM_URL }}" \
            --set-env-vars "ROBLOX_ALEXA_SHARED_SECRET=${{ secrets.ROBLOX_ALEXA_SHARED_SECRET }}" \
             --set-env-vars "BRIDGE_API_KEY=${{ secrets.BRIDGE_API_KEY }}" \
             --update-secrets "MINECRAFT_BRIDGE_TOKEN=minecraft-bridge-token:latest" \
             --set-env-vars "GOOGLE_APPLICATION_CREDENTIALS_B64=$GOOGLE_CREDS_B64"

      - name: Show deployment URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "✅ Deployed! → $URL"
